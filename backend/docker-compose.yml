# Local Development - PostgreSQL
# Run: docker compose up -d
#
# Expected DATABASE_URL (use 127.0.0.1 to avoid IPv6/localhost conflicts):
#   postgresql://app_user:localdev@127.0.0.1:5432/app_dev
#
# If you get "password authentication failed", the volume may have stale credentials.
# Reset with: docker compose down -v && docker compose up -d

services:
  db:
    image: postgres:16-alpine
    container_name: app-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: app_dev
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: localdev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
