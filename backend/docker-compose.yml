# Local Development - PostgreSQL
# Run: docker compose up -d
#
# Port 5433 is used to avoid conflict with other projects (e.g. another app on 5432).
# Expected DATABASE_URL (use 127.0.0.1 to avoid IPv6/localhost conflicts):
#   postgresql://app_user:localdev@127.0.0.1:5433/app_dev
#
# If backend/.env.local is generated by Terraform, run terraform apply to refresh DATABASE_URL;
# otherwise set DATABASE_URL to the value above.
# If you get "password authentication failed", the volume may have stale credentials
# or another Postgres is bound to this port. Reset the volume with:
#   docker compose -f backend/docker-compose.yml down -v && docker compose -f backend/docker-compose.yml up -d

services:
  db:
    image: postgres:16-alpine
    container_name: app-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: app_dev
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: localdev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
